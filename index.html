<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JS Exercise 1</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>JS Exercise 1</h1>

    <div class="container">

        <div class="input-group">
            <label>Enter First Number:</label>
            <input type="number" id="num1">
        </div>

        <div class="input-group">
            <label>Enter Second Number:</label>
            <input type="number" id="num2">
        </div>

        <div class="buttons">
            <button onclick="calculate()">Calculate</button>
            <button onclick="clearFields()">Clear</button>
        </div>

        <div class="results">

            <div class="result-group">
                <span class="result-label">Sum:</span>
                <span id="sum"></span>
            </div>

            <div class="result-group">
                <span class="result-label">Difference:</span>
                <span id="difference"></span>
            </div>

            <div class="result-group">
                <span class="result-label">Product:</span>
                <span id="product"></span>
            </div>

            <div class="result-group">
                <span class="result-label">Quotient:</span>
                <span id="quotient"></span>
            </div>

        </div>

    </div>

  
    <script src="main.js"></script>

</body>
</html>
